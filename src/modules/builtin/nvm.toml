name = "nvm"
description = "Node Version Manager — lazy-loaded to avoid startup penalty"
category = "package-managers"

[detect]
commands = ['[ -d "$HOME/.nvm" ]']

[install.linux]
command = "curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.0/install.sh | bash"

[install.macos]
command = "curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.0/install.sh | bash"

[zshrc]
snippet = '''
# nvm — lazy-load to avoid ~300ms startup penalty
export NVM_DIR="$HOME/.nvm"
nvm() {
  unfunction nvm node npm npx 2>/dev/null
  [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"
  nvm "$@"
}
node() { nvm; node "$@"; }
npm()  { nvm; npm  "$@"; }
npx()  { nvm; npx  "$@"; }
'''
startup_ms_estimate = 0
order = 120
