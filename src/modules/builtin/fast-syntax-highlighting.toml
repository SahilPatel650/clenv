name = "fast-syntax-highlighting"
description = "Feature-rich syntax highlighting for Zsh"
category = "zsh-plugins"

[detect]
commands = ['[ -f "$HOME/.zsh/fast-syntax-highlighting/fast-syntax-highlighting.plugin.zsh" ]']

[install.linux]
command = "git clone https://github.com/zdharma-continuum/fast-syntax-highlighting.git ~/.zsh/fast-syntax-highlighting"

[install.macos]
command = "git clone https://github.com/zdharma-continuum/fast-syntax-highlighting.git ~/.zsh/fast-syntax-highlighting"

[zshrc]
snippet = 'source ~/.zsh/fast-syntax-highlighting/fast-syntax-highlighting.plugin.zsh'
startup_ms_estimate = 15
order = 31
