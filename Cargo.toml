[package]
name = "clenv"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "clenv"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
walkdir = "2"
rayon = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
arboard = "3"
dirs = "5"
humansize = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
