name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: clenv-macos
            binary: target/release/clenv
          - os: ubuntu-latest
            artifact: clenv-linux
            binary: target/x86_64-unknown-linux-musl/release/clenv

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install musl target (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Pin transitive deps
        run: make pin-deps

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo build --release

      - name: Build (Linux musl)
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Test
        run: cargo test

      - name: Rename binary for release
        run: cp ${{ matrix.binary }} clenv-${{ matrix.os }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: clenv-${{ matrix.os }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: clenv-macos

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: clenv-linux

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clenv-macos-latest
            clenv-ubuntu-latest
          generate_release_notes: true
